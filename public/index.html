  closeSheet();var d=document.createElement('div');d.className='sheet-bg';d.setAttribute('data-a','closeroute');
  var h='<div class="sheet" role="dialog" aria-label="Modifier"><h3>Modifier</h3><div class="lbl">Prénom</div><input id="e-name" maxlength="40" value="'+esc(ed.name)+'">'+
   '<div class="lbl">+1</div><div class="row3"><button data-a="eplus" data-v="0" class="'+(ed.plus.on?'':'on')+'">Sans</button><button data-a="eplus" data-v="1" class="'+(ed.plus.on?'on':'')+'">Avec</button></div>'+
   (ed.plus.on?'<input id="e-plus" maxlength="40" aria-label="Prénom du +1" value="'+esc(ed.plus.name)+'">':'');
  ACTS.forEach(function(a){h+='<div class="lbl">'+esc(a.title)+'</div><div class="row3">'+ORDER.map(function(v){return '<button data-a="evote" data-k="'+a.k+'" data-v="'+v+'" class="'+(ed.votes[a.k]===v?'on':'')+'">'+ST[v]+'</button>'}).join('')+'</div>'});
  h+='<button class="pri" data-a="esave" style="margin-top:8px">Enregistrer</button><button data-a="closeroute">Annuler</button></div>';
  d.innerHTML=h;document.body.appendChild(d);
}
function edSync(){var n=document.getElementById('e-name');if(n)ed.name=n.value;var p=document.getElementById('e-plus');if(p)ed.plus.name=p.value}

/* ---------- itinéraire ---------- */
function openRoute(k){
  var a=ACTS.filter(function(x){return x.k===k})[0],ac=db.config.acts[k]||{};if(!ac.addr)return;
  var q=ac.addr;if(db.config.city&&q.toLowerCase().indexOf(db.config.city.toLowerCase())<0)q+=', '+db.config.city;
  var e=encodeURIComponent(q),ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var links=[];if(ios)links.push(['Plans','https://maps.apple.com/?daddr='+e+'&dirflg=d']);
  links.push(['Google Maps','https://www.google.com/maps/dir/?api=1&destination='+e]);links.push(['Waze','https://waze.com/ul?q='+e+'&navigate=yes']);
  var d=document.createElement('div');d.className='sheet-bg';d.setAttribute('data-a','closeroute');
  d.innerHTML='<div class="sheet" role="dialog" aria-label="Itinéraire"><h3>'+esc(a.title)+'</h3><div class="a">'+esc(ac.addr)+'</div>'+
    links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener" data-a="closeroute">'+l[0]+'</a>'}).join('')+'<button data-a="closeroute">Fermer</button></div>';
  document.body.appendChild(d);
}

/* ---------- actions ---------- */
function flagErr(id){var e=document.getElementById(id);if(e){e.classList.add('err');e.focus()}}
function csvCell(s){s=String(s==null?'':s);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).catch(function(){return legacy(t)})}
  return legacy(t);
}
function legacy(t){
  return new Promise(function(res,rej){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}ta.remove()});
}
function readOrga(){
  var c=db.config;
  c.date=document.getElementById('o-date').value;c.city=document.getElementById('o-city').value.trim();c.deadline=document.getElementById('o-dl').value;
  ACTS.forEach(function(a){c.acts[a.k]={time:document.getElementById('o-'+a.k+'-t').value,addr:document.getElementById('o-'+a.k+'-a').value.trim()}});
  c.invites=document.getElementById('o-inv').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
}
function pushCfg(){return api('/api/config',{method:'PUT',auth:true,body:db.config})}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.getAttribute('data-a');
  if(a==='gedit'){var id=b.getAttribute('data-id'),g=db.guests[id];if(!g)return;readOrga();
    ed={id:id,name:g.name,votes:JSON.parse(JSON.stringify(g.votes||{})),plus:{on:!!(g.plus&&g.plus.on),name:(g.plus&&g.plus.name)||''}};sheetEdit();return}
  if(a==='eplus'){edSync();ed.plus.on=b.getAttribute('data-v')==='1';sheetEdit();return}
  if(a==='evote'){edSync();var vk=b.getAttribute('data-k'),vv=b.getAttribute('data-v');if(ed.votes[vk]===vv)delete ed.votes[vk];else ed.votes[vk]=vv;sheetEdit();return}
  if(a==='esave'){edSync();
    if(!ed.name.trim()){toast('Prénom manquant');return}
    if(ed.plus.on&&!ed.plus.name.trim()){toast('Prénom du +1 manquant');return}
    b.disabled=true;
    api('/api/guests',{method:'PATCH',auth:true,body:{id:ed.id,name:ed.name.trim(),votes:ed.votes,plus:{on:ed.plus.on,name:ed.plus.name.trim()}}})
      .then(function(){closeSheet();return refresh()}).then(function(){toast('Modifié');render(true)})
      .catch(function(er){b.disabled=false;toast(er&&er.code==='exists'?'Ce prénom existe déjà':errMsg(er))});return}
  if(a==='gdel'){var id2=b.getAttribute('data-id'),g2=db.guests[id2];if(!g2)return;readOrga();closeSheet();
    var dd=document.createElement('div');dd.className='sheet-bg';dd.setAttribute('data-a','closeroute');
    dd.innerHTML='<div class="sheet" role="dialog" aria-label="Supprimer"><h3>Supprimer '+esc(g2.name)+' ?</h3><div class="a">Ses réponses seront effacées.</div><button class="danger" data-a="gdelok" data-id="'+esc(id2)+'">Supprimer</button><button data-a="closeroute">Annuler</button></div>';
    document.body.appendChild(dd);return}
  if(a==='gdelok'){b.disabled=true;
    api('/api/guests',{method:'DELETE',auth:true,body:{id:b.getAttribute('data-id')}}).then(function(){closeSheet();return refresh()}).then(function(){toast('Supprimé');render(true)})
      .catch(function(er){b.disabled=false;toast(errMsg(er))});return}
  if(a==='route'){openRoute(b.getAttribute('data-k'));return}
  if(a==='closeroute'){if(b.tagName==='A'){setTimeout(function(){var s=document.querySelector('.sheet-bg');if(s)s.remove()},50);return}if(e.target===b||b.tagName==='BUTTON'){var s=document.querySelector('.sheet-bg');if(s)s.remove()}return}
  if(a==='enter'){
    var n=document.getElementById('name').value.trim();
    if(!n){flagErr('name');toast('Entre ton prénom');return}
    store.set(KM,n);draft=null;go('sondages');
  }else if(a==='notme'){store.del(KM);draft=null;go('')}
  else if(a==='plus'){draft.plus.on=!draft.plus.on;render(true);if(draft.plus.on){var i=document.getElementById('plusname');if(i)i.focus()}}
  else if(a==='vote'){if(closed())return;var kk=b.getAttribute('data-k'),vv=b.getAttribute('data-v');pop=(draft.votes[kk]!==vv)?kk:null;draft.votes[kk]=vv;render(true);if(pop){burst(pop,vv);pop=null}}
  else if(a==='send'){
    if(draft.plus.on&&!draft.plus.name.trim()){flagErr('plusname');toast('Ajoute le prénom de ton +1');return}
    if(!Object.keys(draft.votes).length){toast('Réponds à un sondage');return}
    var id=key(me());var old=db.guests[id];var pl={on:draft.plus.on,name:draft.plus.on?draft.plus.name.trim():''};
    if(b.disabled)return;b.disabled=true;
    api('/api/guest',{method:'PUT',body:{name:me(),votes:draft.votes,plus:pl}}).then(function(){
      db.guests[id]={name:me(),votes:draft.votes,plus:pl,msg:old?old.msg||'':''};go('merci');
    }).catch(function(er){b.disabled=false;toast(errMsg(er))});
  }else if(a==='back'){go(last||'')}
  else if(a==='login'){
    var ci=document.getElementById('code');var v=ci.value;
    var adm=/^[0-9]{4}$/.test(v);
    if(!adm&&!/^[0-9]{6}$/.test(v)){ci.classList.add('err');ci.focus();toast('Code incorrect');return}
    sess.set(KC,v);
    api(adm?'/api/admin/check':'/api/orga/check',{method:'POST',auth:true}).then(function(){sess.set(KA,'1');if(adm)sess.set(KD,'1');return refresh()}).then(function(){go(adm?'admin':'orga')}).catch(function(er){
      sess.del(KC);ci.classList.add('err');ci.value='';ci.focus();toast(er&&er.status===401?'Code incorrect':errMsg(er))});
  }
  else if(a==='gmode'){if(b.getAttribute('data-d')==='1')sess.set(KX,'1');else sess.del(KX);go(b.getAttribute('data-r'))}
  else if(a==='quit'){sess.del(KA);sess.del(KC);sess.del(KD);sess.del(KX);refresh().then(function(){go('')})}
  else if(a==='saveorga'){readOrga();pushCfg().then(function(){toast('Enregistré');render(true)}).catch(function(er){toast(errMsg(er))})}
  else if(a==='copy'){
    readOrga();pushCfg().catch(function(){});var c=db.config;
    var t="Coucou ! N'oublie pas de répondre pour les 30 ans d'Alessia"+(c.deadline?' avant le '+fdate(c.deadline):'')+' : '+location.href.split('#')[0];
    copyText(t).then(function(){toast('Message copié')},function(){toast('Copie impossible')});
  }
  else if(a==='export'){
    var rows=[['Prénom'].concat(ACTS.map(function(x){return x.title}),['+1','Message'])];
    Object.keys(db.guests).forEach(function(id){var g=db.guests[id];
      rows.push([g.name].concat(ACTS.map(function(x){return g.votes[x.k]?ST[g.votes[x.k]]:''}),[g.plus&&g.plus.on?g.plus.name:'',(g.msg||'').replace(/\s+/g,' ')]))});
    copyText(rows.map(function(r){return r.join('\t')}).join('\n')).then(function(){toast('Liste copiée')},function(){toast('Copie impossible')});
  }
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='Confirmer ?';setTimeout(function(){resetArmed=false;if(b.isConnected)b.textContent='Remettre à zéro'},4000);return}
    resetArmed=false;api('/api/reset',{method:'POST',auth:true}).then(function(){db={guests:{},config:emptyCfg()};store.del(KM);draft=null;toast('Tout est remis à zéro');render(true)}).catch(function(er){toast(errMsg(er))});
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='plusname'){draft.plus.name=t.value;t.classList.remove('err')}
  else if(t.id==='name'){t.classList.remove('err')}
  else if(t.id==='code'){t.value=t.value.replace(/\D/g,'').slice(0,6);t.classList.remove('err')}
  else if(t.id==='msg'){var g=db.guests[key(me())];if(g){g.msg=t.value;clearTimeout(msgT);var val=t.value,nm=me();msgT=setTimeout(function(){api('/api/guest',{method:'PUT',body:{name:nm,msg:val}}).catch(function(er){toast(errMsg(er))})},700)}}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var t=e.target;
  if(t.id==='name'){e.preventDefault();document.querySelector('[data-a="enter"]').click()}
  else if(t.id==='code'){e.preventDefault();document.querySelector('[data-a="login"]').click()}
});

/* ---------- pont vers le jeu ---------- */
window.A30={api:api,sess:sess,KC:KC,KD:KD,KX:KX,KM:KM,store:store,me:me,esc:esc,toast:toast,go:go,errMsg:errMsg};

/* ---------- installation ---------- */
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js')}catch(e){}

/* ---------- démarrage ---------- */
function onRoute(){var r=route();if(ready&&(r==='resultats'||r==='orga'||r==='sondages'))refresh().then(function(){if(route()===r&&r!=='sondages')render(true)})}
window.addEventListener('hashchange',onRoute);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&route()==='resultats')refresh().then(function(){if(route()==='resultats')render(true)})});
render(false);
refresh().then(function(ok){if(!ok){ready=true;toast('Connexion impossible, réessaie')}render(false)});
})();
</script>
